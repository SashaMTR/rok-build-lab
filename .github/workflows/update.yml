name: Update RoK data

on:
  schedule:
    # Dimanche 07:30 UTC (≈ 09:30 Paris en été)
    - cron: '30 7 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch talents data
        run: node scripts/fetch-talents.mjs

      - name: Fetch commanders data
        run: node scripts/fetch-commander-data.mjs

      - name: Rebuild JS bundles
        run: node scripts/update.mjs --no-bump

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "chore(data): mise à jour automatique"
            git push
          fi

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets data _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

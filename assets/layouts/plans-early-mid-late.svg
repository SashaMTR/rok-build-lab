<svg xmlns="http://www.w3.org/2000/svg" width="960" height="930" viewBox="0 0 960 930" role="img" aria-labelledby="title desc">
  <title id="title">Three city organisation plans</title>
  <desc id="desc">Original functional diagrams for an early daily loop, midgame growth and war access. The diagrams group frequently used buildings near the normal view. They are not exact tile layouts or import codes.</desc>
  <rect width="960" height="930" rx="24" fill="#111827"/>
  <g font-family="Arial, sans-serif" fill="#f8fafc">
    <text x="40" y="52" font-size="28" font-weight="700">Keep the next tap close</text>
    <text x="40" y="82" font-size="17" fill="#cbd5e1">Functional groups • original examples • not building footprints or share codes</text>
    <g transform="translate(40 115)">
      <rect width="880" height="235" rx="16" fill="#1e293b"/>
      <text x="24" y="36" font-size="23" font-weight="700">1 · Early daily loop</text>
      <text x="24" y="64" font-size="16" fill="#cbd5e1">Leave room beside the buildings you use every login.</text>
      <rect x="24" y="86" width="540" height="98" rx="10" fill="#164e63" stroke="#22d3ee"/>
      <text x="44" y="115" font-size="15" fill="#a5f3fc">DAILY WORKING AREA</text>
      <text x="44" y="148" font-size="20">City Hall · Academy · Training</text>
      <rect x="588" y="86" width="268" height="98" rx="10" fill="#334155"/>
      <text x="608" y="124" font-size="19">Resource buildings</text>
      <text x="608" y="152" font-size="17" fill="#cbd5e1">and expansion space</text>
      <text x="24" y="213" font-size="16" fill="#cbd5e1">Test: collect work → request help → start the next timer.</text>
    </g>
    <g transform="translate(40 370)">
      <rect width="880" height="235" rx="16" fill="#1e293b"/>
      <text x="24" y="36" font-size="23" font-weight="700">2 · Midgame growth</text>
      <text x="24" y="64" font-size="16" fill="#cbd5e1">Keep research, construction and resource assistance together.</text>
      <rect x="24" y="86" width="540" height="98" rx="10" fill="#164e63" stroke="#22d3ee"/>
      <text x="44" y="115" font-size="15" fill="#a5f3fc">DAILY WORKING AREA</text>
      <text x="44" y="146" font-size="19">City Hall · Academy · Alliance Center</text>
      <text x="44" y="173" font-size="19">Trading Post · Active training buildings</text>
      <rect x="588" y="86" width="268" height="98" rx="10" fill="#334155"/>
      <text x="608" y="124" font-size="19">Production groups</text>
      <text x="608" y="152" font-size="17" fill="#cbd5e1">sorted by resource</text>
      <text x="24" y="213" font-size="16" fill="#cbd5e1">Test: finish an upgrade → help → send resources → restart work.</text>
    </g>
    <g transform="translate(40 625)">
      <rect width="880" height="235" rx="16" fill="#1e293b"/>
      <text x="24" y="36" font-size="23" font-weight="700">3 · War access</text>
      <text x="24" y="64" font-size="16" fill="#cbd5e1">Clear the taps used to heal, refill and return to the map.</text>
      <rect x="24" y="86" width="540" height="98" rx="10" fill="#164e63" stroke="#22d3ee"/>
      <text x="44" y="115" font-size="15" fill="#a5f3fc">FIGHTING SESSION WORKING AREA</text>
      <text x="44" y="148" font-size="20">Hospitals · Training · Academy</text>
      <rect x="588" y="86" width="268" height="98" rx="10" fill="#334155"/>
      <text x="608" y="124" font-size="19">Less-used buildings</text>
      <text x="608" y="152" font-size="17" fill="#cbd5e1">and decorations</text>
      <text x="24" y="213" font-size="16" fill="#cbd5e1">Test: start a healing batch → request help → return to the map.</text>
    </g>
    <text x="40" y="899" font-size="16" fill="#cbd5e1">Placement improves convenience. It does not add defence, capacity or production.</text>
  </g>
</svg>
